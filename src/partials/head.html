<!-- Marks scripting as available before first paint so scroll-reveal start states never flash.
     If the main bundle has not reported in after 4s, the mark is removed and everything shows. -->
<script>
  (function (root) {
    root.classList.add('js');
    setTimeout(function () {
      if (!window.__siteReady) root.classList.remove('js');
    }, 4000);
  })(document.documentElement);
</script>
